name: Update Lotto Data

on:
  schedule:
    # 22:00 every Saturday in Asia/Seoul.
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update lotto data
        run: python3 scripts/update_lotto_data.py

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- lotto_data.json; then
            echo "No lotto_data.json changes."
            exit 0
          fi

          latest_round=$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("lotto_data.json").read_text(encoding="utf-8"))[0]["round"])')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_data.json
          git commit -m "Update lotto data to round ${latest_round}"
          git push
